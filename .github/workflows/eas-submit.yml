name: EAS Submit

# Manual only, always gated behind the `production` GitHub Environment.
# Submitting ships a build to the App Store / Play Store review queue — hard
# to reverse — so this must never run without a human clicking approve.
# Configure required reviewers at Settings -> Environments -> production.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to submit
        type: choice
        options: [ios, android]

jobs:
  submit:
    name: Submit (${{ inputs.platform }})
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit latest production build
        run: eas submit --platform ${{ inputs.platform }} --latest --non-interactive
