name: EAS Build

# Manual only — building via EAS consumes build credits/minutes, so it should
# never fire on a routine push. Dev-only for now: production builds and
# `eas submit` are deliberately not wired up here yet — that needs a
# GitHub Environment with required reviewers (Settings -> Environments),
# which requires web UI access to configure. Revisit before shipping a
# production build. See README's "CI/CD and approvals" section.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [ios, android, all]
        default: all
      profile:
        description: EAS build profile (see eas.json)
        type: choice
        options: [development, preview]
        default: preview

jobs:
  build:
    name: Build (${{ inputs.profile }} / ${{ inputs.platform }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
